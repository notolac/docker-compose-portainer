# Nginx Proxy Manager + GoAccess
#
# Environment variables:
# - NPM_DATA_ROOT        NPM data directory (default: /opt/nginx-proxy-manager)
# - TRAEFIK_LOG_PATH     Traefik or NPM log directory for GoAccess (default: /opt/traefik/logs)
# - TZ                   Timezone (default: UTC)

services:
  app:
    image: "docker.io/jc21/nginx-proxy-manager:latest"
    container_name: nginx-proxy
    restart: always
    ports:
      - ${NPM_HTTP_PORT:-8080}:80
      - ${NPM_ADMIN_PORT:-8181}:81
      - ${NPM_HTTPS_PORT:-443}:443
    volumes:
      - data:/data
      - letsencrypt:/etc/letsencrypt
      - ${NPM_DATA_ROOT:-/opt/nginx-proxy-manager}/_hsts.conf:/app/templates/_hsts.conf:ro

  goaccess:
    image: "xavierh/goaccess-for-nginxproxymanager:latest"
    container_name: goaccess
    restart: always
    ports:
      - "${GOACCESS_PORT:-7880}:7880"
    environment:
      - TZ=${TZ:-UTC}
      - SKIP_ARCHIVED_LOGS=False
      - DEBUG=False
      - BASIC_AUTH=False
      - BASIC_AUTH_USERNAME=
      - BASIC_AUTH_PASSWORD=
      - EXCLUDE_IPS=127.0.0.1
      - LOG_TYPE=${LOG_TYPE:-NPM}
      - ENABLE_BROWSERS_LIST=True
      - HTML_REFRESH=5
      - KEEP_LAST=90
      - PROCESSING_THREADS=1
    volumes:
      - ${TRAEFIK_LOG_PATH:-/opt/nginx-proxy-manager/data/logs}:/opt/log:ro

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NPM_DATA_ROOT:-/opt/nginx-proxy-manager}/data
  letsencrypt:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NPM_DATA_ROOT:-/opt/nginx-proxy-manager}/letsencrypt
