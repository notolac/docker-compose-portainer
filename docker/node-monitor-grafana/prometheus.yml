global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: monitoring
    site: server-01

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: server-01
          
  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          host: server-01
          role: media

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          host: server-01
          role: media
