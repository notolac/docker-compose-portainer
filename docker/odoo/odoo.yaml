---
# Odoo ERP — single instance template
#
# Environment variables:
# - ODOO_DATA_ROOT   Config and addons root (default: /opt/odoo)
# - USER, PASSWORD, POSTGRES_USER, POSTGRES_PASSWORD

services:
  web:
    image: odoo:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ODOO_PORT:-8077}:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ${ODOO_DATA_ROOT:-/opt/odoo}/config:/etc/odoo
      - ${ODOO_DATA_ROOT:-/opt/odoo}/addons:/mnt/extra-addons
      #- ${ODOO_EXTRA_ADDONS_PATH:-/opt/odoo/custom-addons}:/var/lib/odoo/.local/share/Odoo/addons/16.0
    environment:
      - HOST=db
      - USER=${USER}
      - PASSWORD=${PASSWORD}
      - proxy_mode=True
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

volumes:
  odoo-web-data:
  odoo-db-data:
