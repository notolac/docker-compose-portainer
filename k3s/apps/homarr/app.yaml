# Homarr — generic K3s manifests (no personal hosts, IPs, or secrets).
# Storage: change `storageClassName` to yours (default here: Rook-Ceph `ceph-block`).
# Expose: Service is ClusterIP — see ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: homarr
  namespace: homarr
spec:
  selector:
    app: homarr
  ports:
    - port: 7575
      targetPort: 7575
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homarr-data
  namespace: homarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: homarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7575
          env:
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-env
                  key: SECRET_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /appdata
          resources:
            requests:
              cpu: 50m
              memory: 600Mi
            limits:
              memory: 1200Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homarr-data
