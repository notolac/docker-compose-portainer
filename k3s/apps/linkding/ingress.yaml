# Generic Ingress example — set your host, TLS, and ingress class, then apply.
# Keep LD_CSRF_TRUSTED_ORIGINS in app.yaml in sync with this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
spec:
  rules:
    - host: linkding.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 9090
