# Onyx api / background / web / nginx — generic K3s manifests (no personal data).
# Config + secrets: `onyx-config` ConfigMap and `onyx-env` Secret (see README).
# If your chat LLM lives behind a public hostname that does not resolve
# in-cluster, add a hostAliases entry (example commented below) or point the
# model at the in-cluster Service instead.
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: onyx
spec:
  selector:
    app: onyx-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
  namespace: onyx
spec:
  selector:
    app: onyx-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: onyx
spec:
  selector:
    app: onyx-nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: onyx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onyx-api
  template:
    metadata:
      labels:
        app: onyx-api
        app.kubernetes.io/part-of: onyx
    spec:
      # Example: resolve an external LLM hostname inside the pod.
      # hostAliases:
      #   - ip: "203.0.113.10"
      #     hostnames:
      #       - llm.example.com
      enableServiceLinks: false
      initContainers:
        - name: wait-postgres
          image: postgres:15.2-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U onyxman; do sleep 2; done
      containers:
        - name: api
          image: onyxdotapp/onyx-backend:v4.7.7
          command: ["/bin/sh", "-c"]
          args:
            - alembic upgrade head && echo 'Starting Onyx Api Server' && uvicorn onyx.main:app --host 0.0.0.0 --port 8080
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: onyx-config
            - secretRef:
                name: onyx-env
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: onyx-env
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onyx-env
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: files
              mountPath: /app/file-system
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: onyx-file-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background
  namespace: onyx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onyx-background
  template:
    metadata:
      labels:
        app: onyx-background
        app.kubernetes.io/part-of: onyx
    spec:
      # hostAliases: see api-server above if your LLM hostname needs it.
      enableServiceLinks: false
      containers:
        - name: background
          image: onyxdotapp/onyx-backend:v4.7.7
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /app/scripts/setup_craft_templates.sh ]; then
                /app/scripts/setup_craft_templates.sh
              fi
              exec /app/scripts/supervisord_entrypoint.sh
          envFrom:
            - configMapRef:
                name: onyx-config
            - secretRef:
                name: onyx-env
          volumeMounts:
            - name: files
              mountPath: /app/file-system
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: onyx-file-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: onyx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onyx-web
  template:
    metadata:
      labels:
        app: onyx-web
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: onyxdotapp/onyx-web-server:v4.7.7
          env:
            - name: INTERNAL_URL
              value: http://api-server:8080
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: onyx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onyx-nginx
  template:
    metadata:
      labels:
        app: onyx-nginx
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.25.5-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              rm -f /etc/nginx/conf.d/default.conf
              cp -a /nginx-templates/. /etc/nginx/conf.d/
              sed 's/\r$//' /etc/nginx/conf.d/run-nginx.sh > /tmp/run-nginx.sh
              chmod +x /tmp/run-nginx.sh
              exec /tmp/run-nginx.sh app.conf.template
          envFrom:
            - configMapRef:
                name: onyx-config
          ports:
            - containerPort: 80
          volumeMounts:
            - name: templates
              mountPath: /nginx-templates
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: templates
          configMap:
            name: onyx-nginx-templates
            defaultMode: 0755
