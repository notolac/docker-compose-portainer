# Generic Ingress example — set your host, TLS, and ingress class, then apply.
# Keep PROXY_BASE_URL in litellm.yaml in sync with this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: litellm
spec:
  rules:
    - host: litellm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
