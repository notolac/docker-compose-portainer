# LiteLLM proxy — generic K3s manifests (no personal hosts, IPs, or secrets).
# Secrets live in `litellm-env` (see litellm-k3s.env.example). Set PROXY_BASE_URL
# to your public URL. Redis is REQUIRED here: the ConfigMap below wires router
# state + cache to it, and the proxy only uses Redis with that config present.
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    router_settings:
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
    litellm_settings:
      drop_params: true
      cache: True
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.litellm.svc.cluster.local -p 5432 -U "${POSTGRES_USER}"; do
                echo waiting for postgres...
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: POSTGRES_USER
        - name: wait-redis
          image: redis:7.4-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli --no-auth-warning -h redis.litellm.svc.cluster.local -a "${REDIS_PASSWORD}" ping | grep -q PONG; do
                echo waiting for redis...
                sleep 2
              done
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: REDIS_PASSWORD
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.101.0
          args:
            - --port
            - "4000"
            - --config
            - /app/proxy_server_config.yaml
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: DATABASE_URL
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: STORE_PROMPTS_IN_SPEND_LOGS
              value: "True"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: LITELLM_SALT_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: REDIS_URL
            - name: REDIS_HOST
              value: redis.litellm.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: REDIS_PASSWORD
            - name: PROXY_BASE_URL
              value: https://litellm.example.com
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/proxy_server_config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
