# whoami — HTTP echo smoke test for the Traefik install.
# Set YOUR host, apply, then curl it. Terminate TLS at the ingress.
# Validates: MetalLB VIP -> Traefik -> ClusterIP Service -> pod.
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: traefik
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: traefik-stack
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: traefik
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: traefik-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
# Standard Ingress path (no file provider needed).
# For the file-provider equivalent, copy dynamic-app-example.yaml instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
    # Optional: attach Middleware CRDs once created, e.g.
    # traefik.ingress.kubernetes.io/router.middlewares: traefik-secureHeaders@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: whoami.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
