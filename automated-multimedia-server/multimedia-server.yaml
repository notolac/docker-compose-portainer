---
# Media automation stack (*arr + qBittorrent over Gluetun VPN)
#
# Environment variables (set in Portainer or .env — no quotes):
# - WIREGUARD_PRIVATE_KEY       ProtonVPN WireGuard private key
# - MEDIA_CONFIG_ROOT           App config root (default: /opt/media-services)
# - DOWNLOADS_PATH              Torrent download directory (default: /data/downloads)
# - MOVIES_PATH                 Movie library (default: /data/media/movies)
# - TV_PATH                     TV library (default: /data/media/tv)
# - MUSIC_PATH                  Music library (default: /data/media/music)
# - TZ                          Timezone (default: UTC)
#
# Example:
#   mkdir -p /opt/media-services/{gluetun,qbittorrent,prowlarr,radarr,sonarr,lidarr}
#   mkdir -p /data/downloads /data/media/{movies,tv,music}

x-defaults: &defaults
  restart: unless-stopped

services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    <<: *defaults
    hostname: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 6881:6881
      - 6881:6881/udp
      - 8097:8097 # qbittorrent
      - 8989:8989 # Sonarr
      - 9696:9696 # Prowlarr
      - 7878:7878 # Radarr
      - 8686:8686 # Lidarr
      - 8787:8787 # Readarr
    volumes:
      - ${MEDIA_CONFIG_ROOT:-/opt/media-services}/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - PORT_FORWARD_ONLY=on
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Netherlands,Spain,Germany}
      - TZ=${TZ:-UTC}
      - UPDATER_PERIOD=24h


  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    <<: *defaults
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8097
      - TORRENTING_PORT=6881
    volumes:
      - ${MEDIA_CONFIG_ROOT:-/opt/media-services}/qbittorrent:/config
      - ${DOWNLOADS_PATH:-/data/downloads}:/downloads
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"


  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    <<: *defaults
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${MEDIA_CONFIG_ROOT:-/opt/media-services}/prowlarr:/config
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"


  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    <<: *defaults
    environment:
      - UMASK_SET=022
      - TZ=${TZ:-UTC}
      - PUID=1000
      - PGID=1000
    volumes:
      - ${MOVIES_PATH:-/data/media/movies}:/movies
      - ${DOWNLOADS_PATH:-/data/downloads}:/downloads
      - ${MEDIA_CONFIG_ROOT:-/opt/media-services}/radarr:/config
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "1.0"


  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    <<: *defaults
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${MEDIA_CONFIG_ROOT:-/opt/media-services}/sonarr:/config
      - ${TV_PATH:-/data/media/tv}:/tv
      - ${DOWNLOADS_PATH:-/data/downloads}:/downloads
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "1.0"


  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    <<: *defaults
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${MEDIA_CONFIG_ROOT:-/opt/media-services}/lidarr:/config
      - ${MUSIC_PATH:-/data/media/music}:/music
      - ${DOWNLOADS_PATH:-/data/downloads}:/downloads
    depends_on:
      - gluetun
    network_mode: "service:gluetun"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"